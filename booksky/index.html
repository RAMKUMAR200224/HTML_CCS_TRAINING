<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=bi, initial-scale=1.0">
    <title>booksky</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
     <div class="navbar">
        <h1>booksky</h1>
     </div>
     
     <div class="container">
        <div class="book-container">
            <h2>rich dad poor dad</h2>
            <h5>robot</h5>
            <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Veritatis aspernatur quae laborum molestiae eos dolores voluptatem, nobis molestias repudiandae ex nulla eius, commodi cupiditate fuga, rem illum mollitia possimus quibusdam.</p>
            <button onclick="deletebook(event)">Delete</button>
        </div>
     </div>
     <div class="popup-overlay"></div>
     <div class="popup-box">
        <h2>Add Book</h2>
        <form action="">
            <input type="text" placeholder="book title" id="book-title-input">
            <input type="text" placeholder="book author" id="book-title-author">
            <textarea placeholder="short description" id="book-description-input"></textarea>
            <button id="add-book">Add</button>
            <button id="cancel-popup">Cancel</button>
        </form>
     </div>

     <button class="add-button" id="add-popup-button">+</button>
     
    <script src="main.js"></script>
</body>
</html>
